name: Run Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Instala dependências essenciais diretamente para evitar erros com caminhos locais no requirements.txt
        # Se você limpar seu requirements.txt, pode descomentar a linha abaixo:
        # pip install -r requirements.txt
        pip install pandas numpy scikit-learn matplotlib seaborn shap xgboost lightgbm
        pip install pytest pytest-cov pytest-mock

    - name: Run tests
      run: |
        # Adiciona o diretório atual ao PYTHONPATH para garantir que os módulos sejam encontrados
        export PYTHONPATH=$PYTHONPATH:.
        pytest --cov=. --cov-report=xml

    - name: Upload Relatorio Executivo as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Relatorio_Executivo_Titanic
        path: output/relatorios/Relatorio_Executivo_Titanic.pdf
        if-no-files-found: error